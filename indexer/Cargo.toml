[package]
name = "indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
trie-rs = { version = "0.4.2", features = ["serde"] }
anyhow = "1.0"
scraper = "0.19.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

search_normalizer = { git = "https://github.com/pandevim/search_normalizer.git", branch = "main" }
