[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
vercel_runtime = "2"
tokio = { version = "1", features = ["macros", "fs", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
simple_wiki_search = { path = "../server" }

[[bin]]
name = "search"
path = "search.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
